appId: com.gerador.orcamentos
productName: Gerador de Orçamentos
protocols:
  - name: Gerador de Orçamentos
    schemes:
      - geradororcamento
directories:
  output: release
  buildResources: build
afterPack: ./scripts/afterPack.cjs
# Apenas o código compilado entra no asar. O electron-builder acrescenta
# package.json e dependências de produção; SQL/IA entram via extraResources.
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - servico.json
  - from: supabase
    to: supabase
    filter:
      - schema.sql
      - schema-colaboracao.sql
      - CONFIGURACAO.md
  - from: supabase/migrations
    to: supabase/migrations
    # Toda migração nova entra sozinha; 001 a 003 são da nuvem legada e ficam de fora.
    filter:
      - '*.sql'
      - '!001_*.sql'
      - '!002_*.sql'
      - '!003_*.sql'
  - from: supabase/rollbacks
    to: supabase/rollbacks
    filter:
      - '*.sql'
  # Runtime de IA (llama-server.exe + modelo GGUF), baixado por `npm run ia`.
  - from: resources/ia
    to: ia
    filter:
      - '**/*'
asarUnpack:
  # O .wasm do SQLite é lido do disco: fora do asar o carregamento é direto.
  - '**/node_modules/node-sqlite3-wasm/**/*'
win:
  signAndEditExecutable: false
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  include: build/installer.nsh
  oneClick: false
  installerLanguages:
    - pt_BR
  unicode: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
npmRebuild: false
