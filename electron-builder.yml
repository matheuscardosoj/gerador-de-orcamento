appId: com.gerador.orcamentos
productName: Gerador de Orçamentos
directories:
  output: release
  buildResources: build
afterPack: ./scripts/afterPack.cjs
# Apenas o código compilado entra no asar. O electron-builder acrescenta
# package.json e dependências de produção; SQL/IA entram via extraResources.
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: .
    filter:
      - servico.json
  - from: supabase
    to: supabase
    filter:
      - schema.sql
      - schema-colaboracao.sql
      - CONFIGURACAO.md
  # Runtime de IA (llama-server.exe + modelo GGUF), baixado por `npm run ia`.
  - from: resources/ia
    to: ia
    filter:
      - '**/*'
asarUnpack:
  # O .wasm do SQLite é lido do disco: fora do asar o carregamento é direto.
  - '**/node_modules/node-sqlite3-wasm/**/*'
win:
  signAndEditExecutable: false
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
npmRebuild: false
