appId: com.gerador.orcamentos
productName: Gerador de Orçamentos
directories:
  output: release
  buildResources: build
afterPack: ./scripts/afterPack.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  # Artefatos de builds anteriores nunca fazem parte do aplicativo. Sem esta
  # regra, um instalador candidato poderia embutir a própria pasta release.
  - '!release/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # `resources/` entra só via extraResources; sem esta exclusão o modelo de IA
  # (>1 GB) seria copiado duas vezes e o NSIS estouraria o limite de memória.
  - '!resources/**'
extraResources:
  # Runtime de IA (llama-server.exe + modelo GGUF), baixado por `npm run ia`.
  - from: resources/ia
    to: ia
    filter:
      - '**/*'
asarUnpack:
  # O .wasm do SQLite é lido do disco: fora do asar o carregamento é direto.
  - '**/node_modules/node-sqlite3-wasm/**/*'
win:
  signAndEditExecutable: false
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
npmRebuild: false
